<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ec · English Companion</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F59E0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My English Companion">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Tailwind & Schrift liegen lokal (kein CDN, keine Google-Server → DSGVO,
     schneller Start, komplett offline-fähig).
     tailwind.css neu erzeugen, falls neue Utility-Klassen dazukommen:
     npx tailwindcss@3.4.17 -i in.css -o tailwind.css --content "index.html,js/**/*.js" --minify
     (in.css: "@tailwind base; @tailwind components; @tailwind utilities;") -->
<link rel="stylesheet" href="tailwind.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="bg-slate-50">

<!-- TOPBAR (mobile) -->
<div id="topbar" style="position:fixed;top:0;left:0;right:0;min-height:3.25rem;height:calc(3.25rem + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:#fff;border-bottom:1px solid #F1F5F9;z-index:50;align-items:center;padding-left:1rem;padding-right:1rem;gap:.6rem">
  <button onclick="toggleSidebar()" style="background:none;border:none;cursor:pointer;font-size:1.4rem;padding:.25rem;line-height:1;color:#475569" aria-label="Menü">☰</button>
  <button onclick="go('home')" style="display:flex;align-items:center;gap:.6rem;background:none;border:none;cursor:pointer;padding:0;min-width:0" aria-label="Home"><img src="icon-192.png" alt="ec" style="width:1.6rem;height:1.6rem;border-radius:.4rem;object-fit:cover;flex-shrink:0"><span style="font-weight:700;color:#2563EB;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">English Companion</span></button>
</div>
<!-- SIDEBAR OVERLAY -->
<div id="sidebar-overlay" onclick="toggleSidebar()"></div>
<!-- SIDEBAR -->
<aside id="sidebar" class="fixed top-0 left-0 h-full w-56 bg-white border-r border-slate-100 flex-col z-40">
  <div class="px-5 py-5 border-b border-slate-100">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <button onclick="go('home')" class="flex items-center gap-2 font-bold text-blue-600 text-base" style="background:none;border:none;cursor:pointer;padding:0" aria-label="Home">
        <img src="icon-192.png" alt="ec" style="width:2rem;height:2rem;border-radius:.4rem;object-fit:cover;background:#F59E0B">
        <span style="font-size:.95rem">English Companion</span>
      </button>
      <button onclick="toggleSidebar()" id="sidebar-close" style="background:none;border:none;cursor:pointer;font-size:1.3rem;color:#94A3B8;display:none;padding:.2rem" aria-label="Menü schließen">✕</button>
    </div>
  </div>
  <nav class="flex-1 overflow-y-auto py-3 px-3 side-nav">
    <button class="nav-link" onclick="go('home')"><i>🏠</i><span data-i18n="nav_home">Home</span></button>

    <p class="nav-group" data-i18n="nav_group_learn">Learn</p>
    <button class="nav-link" onclick="go('grammar')"><i>📚</i><span data-i18n="nav_grammar">Grammar</span></button>
    <button class="nav-link" onclick="go('vocabulary')"><i>🔤</i><span data-i18n="nav_vocab">Vocabulary</span></button>
    <button class="nav-link" onclick="go('irreg','list')"><i>📋</i><span data-i18n="nav_irreg">Irregular Verbs</span></button>
    <button class="nav-link" onclick="go('reading-list')"><i>📖</i><span data-i18n="nav_reading">Reading</span></button>
    <button class="nav-link" onclick="go('listening-list')"><i>🎧</i><span data-i18n="area_listening">Listening</span></button>
    <button class="nav-link" onclick="go('writing-list')"><i>✏️</i><span data-i18n="nav_writing">Writing</span></button>

    <p class="nav-group" data-i18n="nav_group_practise">Practise</p>
    <button class="nav-link" onclick="go('review')"><i>🔁</i><span data-i18n="nav_review">Review</span><span id="nav-review-badge" class="nav-badge" style="display:none"></span></button>
    <button class="nav-link" onclick="go('spiele')"><i>🎮</i><span data-i18n="nav_games">Games</span></button>
    <button class="nav-link" onclick="go('practice')"><i>⚡</i><span data-i18n="nav_practice">Practice</span></button>
    <button class="nav-link" onclick="go('dict-skills')"><i>📕</i><span data-i18n="nav_dict">Dictionary Skills</span></button>

    <p class="nav-group" data-i18n="nav_group_me">Me</p>
    <button class="nav-link" onclick="go('lernweg')"><i>📈</i><span data-i18n="nav_progress">My Progress</span></button>
    <button class="nav-link" onclick="go('help')"><i>❓</i><span data-i18n="nav_help">Help & Tips</span></button>
    <button class="nav-link" onclick="go('extern')"><i>🔗</i><span data-i18n="nav_extern">More Practice</span></button>

    <!-- Einstellungen: Sprache, Lesehilfen, Installation – kompakt am Ende -->
    <div class="nav-settings">
      <p class="nav-group" data-i18n="nav_settings">Settings</p>
      <div class="seg" role="group" aria-label="Language">
        <button onclick="setLang('en1')" id="lang-btn-en1" title="Simple English"><span data-i18n="lang_easy">Easy</span></button>
        <button onclick="setLang('en2')" id="lang-btn-en2" title="Standard English">English</button>
        <button onclick="setLang('de')" id="lang-btn-de" title="Deutsch">Deutsch</button>
      </div>
      <div class="toggle-row">
        <button onclick="toggleBigText()" id="a11y-btn-big"><b>Aa</b> <span data-i18n="a11y_big">Larger text</span></button>
        <button onclick="toggleEasyRead()" id="a11y-btn-easy"><b>↔</b> <span data-i18n="a11y_easy">Easier reading</span></button>
      </div>
      <div id="pwa-install-box">
        <button id="pwa-install-btn" class="nav-link" onclick="triggerPWAInstall()" style="display:none"><i>⬇️</i><span>Install App</span></button>
        <button class="nav-link nav-link-quiet" onclick="go('pwa-help')"><i>📲</i><span data-i18n="nav_install">Install the app</span></button>
      </div>
    </div>
  </nav>
</aside>

<!-- MOBILE NAV -->
<!-- display wird rein per CSS gesteuert (mobil: flex, Desktop: none) –
     ein inline display:none würde die Media-Query immer überstimmen -->
<nav id="mobile-nav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 z-40 justify-around py-1" style="padding-bottom:env(safe-area-inset-bottom)">
  <button style="background:none;border:none;font-family:inherit" onclick="go('home')" class="flex flex-col items-center gap-0.5 py-1 px-2 cursor-pointer text-slate-500 text-xs"><span style="font-size:1.2rem">🏠</span><span data-i18n="nav_home">Home</span></button>
  <button style="background:none;border:none;font-family:inherit" onclick="go('grammar')" class="flex flex-col items-center gap-0.5 py-1 px-2 cursor-pointer text-slate-500 text-xs"><span style="font-size:1.2rem">📚</span><span data-i18n="nav_grammar">Grammar</span></button>
  <button style="background:none;border:none;font-family:inherit" onclick="go('vocabulary')" class="flex flex-col items-center gap-0.5 py-1 px-2 cursor-pointer text-slate-500 text-xs"><span style="font-size:1.2rem">🔤</span><span data-i18n="nav_vocab">Vocabulary</span></button>
  
  <button style="background:none;border:none;font-family:inherit" onclick="go('reading-list')" class="flex flex-col items-center gap-0.5 py-1 px-2 cursor-pointer text-slate-500 text-xs"><span style="font-size:1.2rem">📖</span><span data-i18n="nav_reading">Reading</span></button>
  <button style="background:none;border:none;font-family:inherit" onclick="go('lernweg')" class="flex flex-col items-center gap-0.5 py-1 px-2 cursor-pointer text-slate-500 text-xs"><span style="font-size:1.2rem">📈</span><span data-i18n="nav_progress">My Progress</span></button>
</nav>

<!-- MAIN -->
<div class="main-content" style="margin-left:14rem; min-height:100vh; padding:2rem 2rem 4rem">
  <div id="app"></div>
</div>
<!-- Reihenfolge wichtig: Inhalte und Grundfunktionen zuerst, js/app.js startet die App. -->
<script src="js/config.js"></script>
<script src="data/grammar.js"></script>
<script src="data/vocab.js"></script>
<script src="data/irregular-verbs.js"></script>
<script src="data/skills.js"></script>
<script src="data/badges.js"></script>
<script src="js/storage.js"></script>
<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/srs.js"></script>
<script src="data/grammar-ohe.js"></script>
<script src="js/router.js"></script>
<script src="js/features/home.js"></script>
<script src="js/features/onboarding.js"></script>
<script src="js/features/grammar.js"></script>
<script src="js/features/vocabulary.js"></script>
<script src="js/features/irregular-verbs.js"></script>
<script src="js/features/skills.js"></script>
<script src="js/features/games.js"></script>
<script src="js/features/practice.js"></script>
<script src="js/features/today.js"></script>
<script src="js/features/progress.js"></script>
<script src="js/features/help.js"></script>
<script src="js/app.js"></script>
</body>
</html>
